name: Build APK

# Executa sempre que houver push no master
on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar o repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3️⃣ Instalar dependências do projeto
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build do app web
      - name: Build Web
        run: npm run build

      # 5️⃣ Instalar Capacitor
      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/android

      # 6️⃣ Adicionar Android e sincronizar
      - name: Initialize Capacitor Android
        run: |
          npx cap add android || echo "Android already added"
          npx cap sync android

      # 7️⃣ Gerar APK debug
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 8️⃣ Subir APK como artefato para download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
