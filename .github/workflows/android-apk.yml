name: Build APK

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar o repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3️⃣ Instalar dependências do projeto
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build do app web
      - name: Build Web
        run: npm run build

      # 5️⃣ Instalar Capacitor
      - name: Install Capacitor
        run: npm install @capacitor/cli @capacitor/android

      # 6️⃣ Configurar Java (JDK 17)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 7️⃣ Instalar Android SDK e Build Tools
      - name: Install Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33
          build-tools: "33.0.2"

      # 8️⃣ Inicializar Capacitor Android
      - name: Initialize Capacitor Android
        run: |
          npx cap add android || echo "Android already added"
          npx cap sync android

      # 9️⃣ Build APK debug
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      # 🔟 Subir APK como artefato
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
